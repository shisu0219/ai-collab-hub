name: 部署前端到 GitHub Pages

# 什么时候触发：
#   1. push 到 main 分支，且改了前端代码或这个 workflow
#   2. 也可以在 GitHub 网页上手动点（workflow_dispatch）
on:
  push:
    branches: [main]
    paths:
      - 'ai-collab-hub-web/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

# 给 GITHUB_TOKEN 推送 pages 的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，新的等旧的跑完（避免并发冲突）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ai-collab-hub-web/package-lock.json

      - name: 装依赖
        working-directory: ai-collab-hub-web
        run: npm ci

      - name: 构建
        working-directory: ai-collab-hub-web
        run: npm run build
        # 构建时会自动读 .env.production（里面有 VITE_BASE 和 VITE_API_BASE）

      - name: 配置 Pages
        uses: actions/configure-pages@v4

      - name: 上传产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: ai-collab-hub-web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 Pages
        id: deployment
        uses: actions/deploy-pages@v4
